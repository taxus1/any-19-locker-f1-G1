version: "3.8"

# 一键起环境：mysql 8 + redis 7（**在宿主机上执行**）。符合标注规范「已容器化，可一键起环境」。
# ⚠️ 做题容器内没有 docker；容器内连这套中间件走 host.docker.internal（见 DB_DSN / REDIS_ADDR）。
services:
  mysql:
    image: mysql:8.2.0
    container_name: go-gin-m-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: some_pro
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - go-gin-m-mysql-data:/var/lib/mysql

  redis:
    image: redis:7.2
    container_name: go-gin-m-redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - go-gin-m-redis-data:/data

volumes:
  go-gin-m-mysql-data:
  go-gin-m-redis-data:
